name: Compliance Pipeline

'on':
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  foundation-check:
    name: Verificação da Fundação do Repositório
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Validar arquivos e diretórios essenciais
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verificando arquivos da fundação ==="

          required_files=(
            ".gitignore"
            ".github/pull_request_template.md"
            ".github/workflows/compliance.yml"
            "CONTRIBUTING.md"
            "LICENSE"
            "README.md"
            "docs/01-visao-geral.md"
            "docs/02-arquitetura.md"
            "docs/03-ferramentas.md"
            "docs/04-politicas.md"
            "docs/05-como-executar.md"
            "docs/06-evidencias.md"
            "docs/07-auditoria.md"
            "docs/08-referencias.md"
            "evidence/README.md"
            "policies/policy.md"
          )

          required_directories=(
            ".github/workflows"
            "app"
            "docs"
            "evidence"
            "policies"
            "scripts"
            "tests"
          )

          failures=0

          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "✓ $file"
            else
              echo "✗ Arquivo ausente: $file"
              failures=$((failures + 1))
            fi
          done

          for directory in "${required_directories[@]}"; do
            if [[ -d "$directory" ]]; then
              echo "✓ $directory/"
            else
              echo "✗ Diretório ausente: $directory/"
              failures=$((failures + 1))
            fi
          done

          if (( failures > 0 )); then
            echo "Fundação incompleta: $failures item(ns) ausente(s)."
            exit 1
          fi

          echo "=== Fundação do repositório em conformidade inicial ==="

  policy-check:
    name: Verificação de Políticas do Repositório
    needs: foundation-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Executar script de políticas
        run: python scripts/check_policies.py

  secret-scan:
    name: Varredura de Segredos
    needs: foundation-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  api-tests:
    name: Testes Automatizados da API
    needs:
      - code-quality
      - dependency-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências da aplicação e dos testes
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt

      - name: Executar testes e gerar relatório JUnit
        run: python -m pytest --junitxml=reports/junit.xml

      - name: Publicar relatório JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-junit-${{ github.run_id }}
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

  code-quality:
    name: Qualidade de Código com Ruff
    needs: secret-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar Ruff
        run: python -m pip install --requirement requirements-dev.txt

      - name: Preparar diretório de relatórios
        run: mkdir -p reports

      - name: Executar Ruff (bloqueante)
        run: ruff check . --output-format=json --output-file=reports/ruff.json

      - name: Publicar relatório do Ruff
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-ruff-${{ github.run_id }}
          path: reports/ruff.json
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Auditoria de Dependências com pip-audit
    needs: secret-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar pip-audit
        run: python -m pip install --requirement requirements-dev.txt

      - name: Preparar diretório de relatórios
        run: mkdir -p reports

      - name: Auditar dependências de execução (bloqueante)
        run: >-
          pip-audit --requirement requirements.txt --strict
          --format=json --output=reports/pip-audit.json

      - name: Publicar relatório do pip-audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-pip-audit-${{ github.run_id }}
          path: reports/pip-audit.json
          if-no-files-found: error
          retention-days: 14
